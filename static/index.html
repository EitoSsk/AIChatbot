<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mio Chat</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:sans-serif;
    background:#f5f5f5;

    height:100vh;

    display:flex;
    flex-direction:column;
}

/* チャット表示 */

#chat{

    flex:1;

    overflow-y:auto;

    padding:15px;

    background:white;

}

/* メッセージ */

.message{

    margin-bottom:16px;

}

.user{

    color:#1565C0;

}

.assistant{

    color:#2E7D32;

}

/* 入力欄 */

#inputArea{

    display:flex;

    gap:10px;

    padding:10px;

    border-top:1px solid #ddd;

    background:white;

    margin-bottom: 20px;

}

#message{

    flex:1;

    padding:12px;

    font-size:16px;

    border:1px solid #ccc;

    border-radius:10px;

}

button{

    padding:0 20px;

    border:none;

    border-radius:10px;

    background:#1976D2;

    color:white;

    font-size:16px;

}

button:active{

    background:#1565C0;

}

</style>

</head>

<body>

<div id="chat"></div>

<div id="inputArea">

    <input
        id="message"
        type="text"
        placeholder="メッセージを入力">

    <button id="whisper" onclick="change_whisper()">
        囁き
    </button>

    <button onclick="sendMessage()">
        送信
    </button>

</div>

<script src="chat.js"></script>

</body>

</html>
